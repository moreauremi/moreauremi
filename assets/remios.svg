  <rect x="40" y="40" width="830" height="426" fill="#000"/>
  <rect x="28" y="28" width="830" height="426" fill="#cfcfcf"/>
  <path d="M28 29 H858 M29 28 V454" stroke="#fff" stroke-width="2"/>
  <path d="M28 453 H858 M857 28 V454" stroke="#5a5a5a" stroke-width="2"/>

