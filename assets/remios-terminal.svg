<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="titre">
  <title id="titre">remi@remios : neofetch de Rémi Moreau</title>
  <style>
    text { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 14px; fill: #c9ced6; }
    .ok { fill: #4fd16b; }
    .info { fill: #6cb8ff; }
    .dim { fill: #7a828c; }
    .bright { fill: #fff; }
    .key { fill: #6cb8ff; font-weight: 600; }
    .bar { fill: #e8ecf5; font-size: 12px; }
    .cur { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { fill: transparent; } }
  </style>

  <!-- fenêtre -->
  <rect x="0.5" y="0.5" width="899" height="329" rx="10" fill="#000" stroke="#333"/>
  <path d="M0.5 32 V10.5 A10 10 0 0 1 10.5 0.5 H889.5 A10 10 0 0 1 899.5 10.5 V32 Z" fill="#1e3c8c"/>
  <line x1="0.5" y1="32" x2="899.5" y2="32" stroke="#ffffff40"/>
  <circle cx="20" cy="16.5" r="5" fill="#ff8a80"/>
  <circle cx="37" cy="16.5" r="5" fill="#ffe81f"/>
  <circle cx="54" cy="16.5" r="5" fill="#4fd16b"/>
  <text x="450" y="21" text-anchor="middle" class="bar">remi@remios: ~</text>

  <!-- commande -->
  <text x="24" y="64" xml:space="preserve"><tspan class="ok">remi@remios</tspan>:<tspan class="info">~</tspan>$ <tspan class="bright">neofetch</tspan></text>

  <!-- logo -->
  <defs>
    <linearGradient id="logo" gradientUnits="userSpaceOnUse" x1="36" y1="0" x2="196" y2="0">
      <stop offset="0" stop-color="#4fd16b"/>
      <stop offset="1" stop-color="#6cb8ff"/>
    </linearGradient>
  </defs>
  <g style="fill: url(#logo)">
    <text x="36" y="142" style="fill: inherit" xml:space="preserve">██████╗ ███╗   ███╗</text>
    <text x="36" y="159" style="fill: inherit" xml:space="preserve">██╔══██╗████╗ ████║</text>
    <text x="36" y="176" style="fill: inherit" xml:space="preserve">██████╔╝██╔████╔██║</text>
    <text x="36" y="193" style="fill: inherit" xml:space="preserve">██╔══██╗██║╚██╔╝██║</text>
    <text x="36" y="210" style="fill: inherit" xml:space="preserve">██║  ██║██║ ╚═╝ ██║</text>
    <text x="36" y="227" style="fill: inherit" xml:space="preserve">╚═╝  ╚═╝╚═╝     ╚═╝</text>
  </g>

  <!-- infos -->
  <text x="240" y="100" class="bright" font-weight="600">Rémi Moreau</text>
  <text x="240" y="120" class="dim">───────────</text>

  <text x="240" y="148" class="key">Rôle</text>
  <text x="330" y="148">Consultant ERP en alternance · 1Life (groupe Visiativ)</text>

  <text x="240" y="170" class="key">Études</text>
  <text x="330" y="170">BTS SIO option SISR · MyDigitalSchool Nantes (2026-2028)</text>

  <text x="240" y="192" class="key">Apprend</text>
  <text x="330" y="192">Open-Prod : achat-vente, gestion à l'affaire, production</text>

  <text x="240" y="214" class="key">Homelab</text>
  <text x="330" y="214">Proxmox · Docker · Jellyfin · NAS · Tailscale</text>

  <text x="240" y="236" class="key">Veille</text>
  <text x="330" y="236">Sécurité des PME · virtualisation · facturation électronique</text>

  <!-- palette -->
  <g transform="translate(240 252)">
