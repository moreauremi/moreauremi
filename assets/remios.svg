<svg xmlns="http://www.w3.org/2000/svg" width="900" height="492" viewBox="0 0 900 492" role="img" aria-labelledby="titre">
  <title id="titre">Bienvenue sur RémiOS : Rémi Moreau</title>
  <style>
    text { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 14px; fill: #101010; }
    .title { fill: #8a1c1c; font-weight: 600; }
    .logo { fill: #1e3c8c; }
    .key { fill: #1e3c8c; font-weight: 600; }
