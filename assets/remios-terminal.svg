    <rect x="26" width="26" height="14" fill="#ff8a80"/>
    <rect x="52" width="26" height="14" fill="#4fd16b"/>
    <rect x="78" width="26" height="14" fill="#ffe81f"/>
    <rect x="104" width="26" height="14" fill="#6cb8ff"/>
    <rect x="130" width="26" height="14" fill="#1e3c8c"/>
    <rect x="156" width="26" height="14" fill="#4bd5ee"/>
    <rect x="182" width="26" height="14" fill="#c9ced6"/>
  </g>

  <!-- invite -->
  <text x="24" y="304" xml:space="preserve"><tspan class="ok">remi@remios</tspan>:<tspan class="info">~</tspan>$ <tspan class="cur">▋</tspan></text>
